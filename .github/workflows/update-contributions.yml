name: Update GitHub Contribution Graph

'on':
  schedule:
    # Run automatically every day at midnight (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual execution via the GitHub Actions tab

permissions:
  contents: write

jobs:
  refresh-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Regenerate Contribution Graph & README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m src.contributions
          python generate.py --readme-only

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/contribution-graph.svg assets/generated/contribution-graph.svg assets/generated/contributions_data.json README.md output/README.md
          if git diff --staged --quiet; then
            echo "No contribution changes detected."
          else
            git commit -m "chore(activity): update static contribution graph and analytics [skip ci]"
            git push
          fi
